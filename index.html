<!DOCTYPE html>
<html>
<head>
<title>Walkman</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button id="btn1">Player</button>
  <button id="btn2">Camera</button>
  <button id="btn3">Notes</button>
  <span id="clock">00:00:00</span>
</div>

<div class="box" id="playerBox">
  <div class="boxtop" id="playerTop">
    Player
    <span class="closeX" id="closePlayer">X</span>
  </div>
  <div class="boxbody">
    <input type="file" id="fileInput" accept="audio/*">
    <p id="songName">no song</p>
    <div id="tape">
      <div id="circle1">O</div>
      <div id="circle2">O</div>
    </div>
    <input type="range" id="seekBar" value="0" min="0" max="100">
    <br>
    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="stopBtn">Stop</button>
    <br>
    Volume:
    <input type="range" id="volBar" value="80" min="0" max="100">
    <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
  </div>
</div>

<div class="box" id="cameraBox" style="display:none;">
  <div class="boxtop" id="cameraTop">
    Camera
    <span class="closeX" id="closeCamera">X</span>
  </div>
  <div class="boxbody">
    <video id="webcam" autoplay></video>
    <canvas id="photoCanvas" style="display:none;"></canvas>
    <br>
    <button id="snapBtn">Take Photo</button>
    <a id="saveLink" style="display:none;" download="photo.png">Save Photo</a>
  </div>
</div>

<div class="box" id="notesBox" style="display:none;">
  <div class="boxtop" id="notesTop">
    Notes
    <span class="closeX" id="closeNotes">X</span>
  </div>
  <div class="boxbody">
    <textarea id="notesArea" placeholder="write your songs here"></textarea>
  </div>
</div>

<div class="box" id="calendarBox" style="display:none;">
  <div class="boxtop" id="calendarTop">
    Calendar
    <span class="closeX" id="closeCalendar">X</span>
  </div>
  <div class="boxbody">
    <p id="monthYear">month year</p>
    <div id="calGrid"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
